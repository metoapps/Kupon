name: Kupon 20 video aktarimi
run-name: Kupon 20 video paketini gelistirme dalina yukle

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kupon-ceremony-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gelistirme dalini al
        uses: actions/checkout@v4
        with:
          ref: feature/motion-engine-ceremony-pilot
          persist-credentials: true
      - name: Google Drive paketini indir
        run: |
          python -m pip install --disable-pip-version-check 'gdown==5.2.0'
          gdown --id '1AZCZWEFh0fcU9UO3737iMm9lwkAv7HTZ' -O /tmp/kupon-20.zip
          echo '3fb977db71cdb9385adfaace28f4917a4dc9884900e6ce8cdf2cc1539c746826  /tmp/kupon-20.zip' | sha256sum -c -
      - name: 20 videoyu guvenle dogrula ve ayikla
        run: |
          python - <<'PY'
          import hashlib, itertools, json, pathlib, zipfile
          archive=pathlib.Path('/tmp/kupon-20.zip')
          players=('METO','LORT','FERO','LATTE','JOSH')
          expected={f'videos/{w}-{l}.mp4' for w,l in itertools.permutations(players,2)}
          dest=pathlib.Path('assets/ceremony/videos')
          with zipfile.ZipFile(archive) as z:
              manifest=json.loads(z.read('manifest.json'))
              entries=manifest['entries']
              assert len(entries)==20 and manifest['count']==20
              assert {e['video'] for e in entries}==expected
              assert len(set(e['video'] for e in entries))==20
              for e in entries:
                  name=e['video']
                  info=z.getinfo(name)
                  assert info.file_size < 25_000_000, name
                  blob=z.read(name)
                  assert hashlib.sha256(blob).hexdigest()==e['sha256'], name
                  dest.mkdir(parents=True,exist_ok=True)
                  (dest/pathlib.Path(name).name).write_bytes(blob)
          print('PASS: 20/20 video, manifest SHA-256, expected pairs')
          PY
      - name: MP4 dosyalarini kontrol et
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python - <<'PY'
          import json, pathlib, subprocess
          videos=sorted(pathlib.Path('assets/ceremony/videos').glob('*.mp4'))
          assert len(videos)==20, f'Expected 20 MP4 files, got {len(videos)}'
          for path in videos:
              cmd=['ffprobe','-v','error','-show_entries','format=duration:stream=codec_type,codec_name','-of','json',str(path)]
              probe=subprocess.run(cmd,capture_output=True,text=True,check=True)
              data=json.loads(probe.stdout)
              duration=float(data['format']['duration'])
              streams=data['streams']
              assert 14.9 <= duration <= 15.1, f'{path}: unexpected duration {duration}'
              assert any(s.get('codec_type')=='video' and s.get('codec_name')=='h264' for s in streams), f'{path}: no H264 video'
              assert any(s.get('codec_type')=='audio' and s.get('codec_name')=='aac' for s in streams), f'{path}: no AAC audio'
              print(f'PASS {path.name}: {duration:.3f}s, H264+AAC')
          print('PASS: 20/20 videos verified')
          PY
      - name: Yalnizca gelistirme dalina kaydet
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ceremony/videos/*.mp4
          if git diff --cached --quiet; then
            echo 'Dosyalar zaten ayni; yeni commit gerekmiyor.'
          else
            git commit -m 'assets(kupon): upload verified 20 ceremony videos with audio'
            git push origin HEAD:feature/motion-engine-ceremony-pilot
          fi
