name: Kupon skor onbellegi
# ESPN fallback uses YYYYMM month queries to avoid HTTP 400.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kupon-football-cache.yml'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kupon-football-cache
  cancel-in-progress: false
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate football data
        run: node tools/update-football-cache.cjs
      - name: Commit snapshot only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/football-2026-2027.json
          if git diff --cached --quiet; then echo 'Snapshot unchanged'; exit 0; fi
          git commit -m 'data: refresh Kupon football scores'
          git pull --rebase origin main
          git push origin HEAD:main
