<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kupon</title></head>
<body style="margin:0;background:#07090d;color:#9aa3b5;font-family:Figtree,system-ui,sans-serif;padding:28px 20px">Kupon yükleniyor…
<script>
(async function(){
  try{
    var r=await fetch("https://raw.githubusercontent.com/metoapps/Kupon/0bbb90c623edce05fd2236835dafef8f269926fa/index.html");
    if(!r.ok) throw new Error("kaynak "+r.status);
    var html=await r.text();
    html=html.replace('sekme === "milli" && milliGorunumu(),','');
    html=html.replace('["milli", "Milli Ara"], ','');
    html=html.replace('function CatismaFiguru() {', TOPFN+'function CatismaEski() {');
    html=html.replace("</body>", PRO+"</body>");
    document.open(); document.write(html); document.close();
  }catch(e){
    document.body.textContent="Yüklenemedi: "+e.message;
  }
})();
var TOPFN = 'function CatismaFiguru(){var s=function(t,p){return React.createElement(t,p);};return s("svg",{className:"pr-catisma-svg kp-top",viewBox:"0 0 64 64","aria-hidden":"true"},s("circle",{cx:"32",cy:"32",r:"30",fill:"#fff",stroke:"#111",strokeWidth:"1.4"}),s("polygon",{points:"32,11 40,17 37,27 27,27 24,17",fill:"#111"}),s("polygon",{points:"32,11 24,17 16,14 17.5,6.5 26,7.5",fill:"#111"}),s("polygon",{points:"32,11 40,17 48,14 46.5,6.5 38,7.5",fill:"#111"}),s("polygon",{points:"24,17 16,14 9,22 13,30 21,27",fill:"#111"}),s("polygon",{points:"40,17 48,14 55,22 51,30 43,27",fill:"#111"}),s("polygon",{points:"13,30 21,27 24,36 17,43 9,37",fill:"#111"}),s("polygon",{points:"51,30 43,27 40,36 47,43 55,37",fill:"#111"}),s("polygon",{points:"24,36 17,43 20,52 28,53 30,44",fill:"#111"}),s("polygon",{points:"40,36 47,43 44,52 36,53 34,44",fill:"#111"}),s("polygon",{points:"28,53 36,53 38,59 26,59",fill:"#111"}));}\n';
var PRO = `<style id="kp-pro">
html,body,#kok,.kp,.kp *{cursor:auto !important}
.pr-catisma-svg{width:56px!important;height:56px!important}
.kp-top{transform-origin:50% 50%;animation:kpDon 7s linear infinite}
@keyframes kpDon{to{transform:rotate(360deg)}}
html,body,#kok{background:#07090d!important}
.kp{--bg:#07090d;--kat:#0e1218;--cizgi:rgba(255,255,255,.1);--fg:#f4f6f8;--sol:#8d95a6;--aksan:#f4f6f8;--aksan-fg:#111;background:#07090d!important;background-image:none!important}
.kp-giris-gorsel{display:none!important}
.kp-mark{font-style:normal!important;font-weight:560!important;font-size:44px!important;letter-spacing:-.04em!important}
.kp-kat{background:#0e1218!important;border:1px solid rgba(255,255,255,.1)!important;border-radius:12px!important;box-shadow:none!important}
.kp-dg{background:#f4f6f8!important;color:#111!important;border-radius:10px!important;box-shadow:none!important}
.kp-alt{background:#07090d!important;border-top:1px solid rgba(255,255,255,.1)!important}
.kp-alt button.on{box-shadow:inset 0 -2px 0 #f4f6f8!important;color:#fff!important}
</style><script>
(function(){
  function sakin(){
    document.querySelectorAll('.kp-giris-gorsel').forEach(function(el){el.remove();});
    document.querySelectorAll('h2,h3,div,p').forEach(function(el){
      var t=(el.textContent||'').trim();
      if(t.indexOf('GitHub')===0 && t.length<80){
        var card=el.closest('.kp-kat')||el.parentElement;
        if(card) card.style.display='none';
      }
    });
  }
  sakin(); setTimeout(sakin,300); setTimeout(sakin,1000);
})();
<\/script>`;
</script></body></html>
