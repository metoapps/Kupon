<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kupon</title></head>
<body style="margin:0;background:#07090d;color:#9aa3b5;font-family:Figtree,system-ui,sans-serif;padding:28px 20px">Kupon yükleniyor…
<script>
(async function(){
  try{
    var r=await fetch("https://raw.githubusercontent.com/metoapps/Kupon/0bbb90c623edce05fd2236835dafef8f269926fa/index.html");
    if(!r.ok) throw new Error("kaynak "+r.status);
    var html=await r.text();
    html=html.replace('sekme === "milli" && milliGorunumu(),','');
    html=html.replace('["milli", "Milli Ara"], ','');
    html=html.replace('function CatismaFiguru() {', TOPFN+'function CatismaEski() {');
    html=html.replace('React.createElement("h1", { className: "kp-mark" }, "Kupon")', 'React.createElement("div",{style:{display:"flex",alignItems:"center",gap:14}},React.createElement(CatismaFiguru),React.createElement("h1", { className: "kp-mark" }, "Kupon"))');
    html=html.replace("</body>", PRO+"</body>");
    document.open(); document.write(html); document.close();
    var ic='<circle cx="32" cy="32" r="30" fill="#fff" stroke="#111" stroke-width="1.4"/><polygon points="32,11 40,17 37,27 27,27 24,17" fill="#111"/><polygon points="32,11 24,17 16,14 17.5,6.5 26,7.5" fill="#111"/><polygon points="32,11 40,17 48,14 46.5,6.5 38,7.5" fill="#111"/><polygon points="24,17 16,14 9,22 13,30 21,27" fill="#111"/><polygon points="40,17 48,14 55,22 51,30 43,27" fill="#111"/><polygon points="13,30 21,27 24,36 17,43 9,37" fill="#111"/><polygon points="51,30 43,27 40,36 47,43 55,37" fill="#111"/><polygon points="24,36 17,43 20,52 28,53 30,44" fill="#111"/><polygon points="40,36 47,43 44,52 36,53 34,44" fill="#111"/><polygon points="28,53 36,53 38,59 26,59" fill="#111"/>';
    function doldur(){
      document.querySelectorAll('svg.kp-top, svg.pr-catisma-svg').forEach(function(el){
        if(!el.querySelector('circle')) el.innerHTML=ic;
      });
    }
    doldur();
    setTimeout(doldur,250);
    setTimeout(doldur,900);
    new MutationObserver(doldur).observe(document.body,{childList:true,subtree:true});
  }catch(e){
    document.body.textContent="Yüklenemedi: "+e.message;
  }
})();
var TOPFN = 'function CatismaFiguru(){return React.createElement("svg",{className:"pr-catisma-svg kp-top",viewBox:"0 0 64 64","aria-hidden":"true"});}\n';
var PRO = `<style id="kp-pro">
html,body,#kok,.kp,.kp *{cursor:auto !important}
.pr-catisma-svg,.kp-top{width:56px!important;height:56px!important;flex:none;display:block}
.kp-top{transform-origin:50% 50%;animation:kpDon 7s linear infinite}
@keyframes kpDon{to{transform:rotate(360deg)}}
html,body,#kok{background:#07090d!important}
.kp{background:#07090d!important;background-image:none!important}
.kp-giris-gorsel{display:none!important}
.kp-mark{font-style:normal!important;font-size:44px!important}
.kp-alt{background:#07090d!important;border-top:1px solid rgba(255,255,255,.1)!important}
</style>`;
</script></body></html>
