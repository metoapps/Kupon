<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kupon</title></head>
<body style="margin:0;background:#07090d;color:#9aa3b5;font-family:Figtree,system-ui,sans-serif;padding:28px 20px">Kupon yükleniyor…
<script>
(async function(){
  try{
    var r=await fetch("https://raw.githubusercontent.com/metoapps/Kupon/0bbb90c623edce05fd2236835dafef8f269926fa/index.html");
    if(!r.ok) throw new Error("kaynak "+r.status);
    var html=await r.text();
    html=html.replace('sekme === "milli" && milliGorunumu(),','');
    html=html.replace('["milli", "Milli Ara"], ','');
    html=html.replace('function CatismaFiguru() {', TOPFN+'function CatismaEski() {');
    html=html.replace('React.createElement("h1", { className: "kp-mark" }, "Kupon")', 'React.createElement("div",{style:{display:"flex",alignItems:"center",gap:14}},React.createElement(CatismaFiguru),React.createElement("h1", { className: "kp-mark" }, "Kupon"))');
    html=html.replace('--bg:#070B14;--kat:#10182A;--kat2:#162038;--cizgi:#2C3D63;','--bg:#07090d;--kat:#10141c;--kat2:#161c27;--cizgi:rgba(255,255,255,.08);');
    html=html.replace('--aksan:#3EC6FF;--aksan-fg:#041018;--banko:#3EC6FF;','--aksan:#f3efe6;--aksan-fg:#12141a;--banko:#3EC6FF;');
    html=html.replace('--kirmizi:#D97B86;--yesil:#3DDC97;','--kirmizi:#e07a86;--yesil:#3dba8b;');
    html=html.replace('background-image:radial-gradient(90% 50% at 0% -10%,rgba(62,198,255,.22) 0%,transparent 55%),radial-gradient(70% 40% at 100% 0%,rgba(91,141,239,.16) 0%,transparent 50%);','background-image:none;');
    html=html.replace('</body>', PRO+'</body>');
    document.open(); document.write(html); document.close();
    var ic='<circle cx="32" cy="32" r="30" fill="#fff" stroke="#111" stroke-width="1.6"/><polygon points="32,11 40,17 37,27 27,27 24,17" fill="#111"/><polygon points="32,11 24,17 16,14 17.5,6.5 26,7.5" fill="#111"/><polygon points="32,11 40,17 48,14 46.5,6.5 38,7.5" fill="#111"/><polygon points="24,17 16,14 9,22 13,30 21,27" fill="#111"/><polygon points="40,17 48,14 55,22 51,30 43,27" fill="#111"/><polygon points="13,30 21,27 24,36 17,43 9,37" fill="#111"/><polygon points="51,30 43,27 40,36 47,43 55,37" fill="#111"/><polygon points="24,36 17,43 20,52 28,53 30,44" fill="#111"/><polygon points="40,36 47,43 44,52 36,53 34,44" fill="#111"/><polygon points="28,53 36,53 38,59 26,59" fill="#111"/>';
    function topSvg(){
      var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
      s.setAttribute('class','kp-top');
      s.setAttribute('viewBox','0 0 64 64');
      s.setAttribute('aria-hidden','true');
      s.innerHTML=ic;
      return s;
    }
    function doldur(){
      document.querySelectorAll('svg.kp-top, svg.pr-catisma-svg').forEach(function(el){
        el.setAttribute('class','kp-top');
        if(!el.querySelector('circle')) el.innerHTML=ic;
      });
      document.querySelectorAll('h1').forEach(function(h){
        var t=(h.textContent||'');
        if(t.indexOf('Kupon')!==0 && t.indexOf('Sezon merkezi')!==0) return;
        var prev=h.previousElementSibling;
        if(prev && prev.classList && prev.classList.contains('kp-top')) return;
        h.parentNode.insertBefore(topSvg(), h);
      });
    }
    doldur(); setTimeout(doldur,300); setTimeout(doldur,1000);
    new MutationObserver(doldur).observe(document.body,{childList:true,subtree:true});
  }catch(e){
    document.body.textContent='Yüklenemedi: '+e.message;
  }
})();
var TOPFN='function CatismaFiguru(){return React.createElement("svg",{className:"kp-top",viewBox:"0 0 64 64","aria-hidden":"true"});}\n';
var PRO=`<style id="kp-pro">
html,body,#kok{background:#07090d!important}
.kp{background:#07090d!important;background-image:none!important;color:#f3efe6!important}
.kp-kat,.kp-kagit{background:#10141c!important;border:1px solid rgba(255,255,255,.08)!important;border-radius:12px!important;box-shadow:none!important}
.kp-et{color:#8e94a3!important}
.kp-dg{background:#f3efe6!important;color:#12141a!important;box-shadow:none!important}
.kp-banko,.kz-tutar{color:#3EC6FF!important}
.pr-green{color:#3dba8b!important}
.kp-alt{background:#07090d!important;border-top:1px solid rgba(255,255,255,.08)!important}
.kp-alt button.on{color:#f3efe6!important;box-shadow:inset 0 -2px 0 #3EC6FF!important}
.kp-top{width:72px!important;height:72px!important;flex:none;display:block;transform-origin:50% 50%;animation:kpDon 2.4s linear infinite!important}
@keyframes kpDon{to{transform:rotate(360deg)}}
.kp-giris-gorsel{display:none!important}
.kp-mark{font-style:normal!important;font-size:44px!important;color:#f3efe6!important}
html,body,#kok,.kp,.kp *{cursor:auto!important}
</style>`;
</script></body></html>
